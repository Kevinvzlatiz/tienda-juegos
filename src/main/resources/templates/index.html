<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Juegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            🎮 Tienda de Juegos
        </a>
    </div>
</nav>
<!-- Titulo y boton de agregar -->
<div class="container-fluid mt-5 px-4">

    <!-- Alerta de exito cuando se agrega un juego nuevo -->
    <div class="alert alert-success"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Lista de Juegos</h1>

        <a class="btn btn-primary" th:href="@{/agregar}">
            + Agregar Juego
        </a>

    </div>

    <!-- Barra de busqueda -->
    <form class="d-flex mb-4"
          th:action="@{/buscar}"
          method="get">

        <input class="form-control me-2"
               type="search"
               name="nombre"
               placeholder="Buscar juego..."
               aria-label="Buscar">

        <button class="btn btn-outline-success">
            Buscar
        </button>

    </form>

    <div class="alert alert-warning"
    th:if="${juegos.isEmpty()}">
        No se encontraron juegos con ese nombre :(
    </div>

    <!-- Lista de juegos -->
    <div class="card shadow">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="juego : ${juegos}">
                        <td th:text="${juego.idJuego}"></td>
                        <td th:text="${juego.nombreJuego}"></td>

                        <td>
                            <span class="badge bg-secondary" th:text="${juego.categoriaJuego}"></span>
                        </td>

                        <td>
                            $<span th:text="${juego.precioJuego}"></span>
                        </td>

                        <td>
                            <a class="btn btn-warning btn-sm"
                               th:href="@{/editar/{id}(id=${juego.idJuego})}">
                                Editar
                            </a>

                            <a class="btn btn-danger btn-sm"
                               th:href="@{/eliminar/{id}(id=${juego.idJuego})}">
                                Eliminar
                            </a>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
