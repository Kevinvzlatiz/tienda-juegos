<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Juego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            🎮 Tienda de Juegos
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-warning">
                    <h3 class="mb-0">
                        Editar Juego
                    </h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/editar}" th:object="${juego}" method="post">

                        <input type="hidden" th:field="*{idJuego}">

                        <div class="mb-3">
                            <label class="form-label">
                                Nombre del juego
                            </label>

                            <input class="form-control"
                                   type="text"
                                   th:field="*{nombreJuego}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Categoría
                            </label>

                            <input class="form-control"
                                   type="text"
                                   th:field="*{categoriaJuego}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Precio
                            </label>

                            <input class="form-control"
                                   type="number"
                                   step="0.01"
                                   th:field="*{precioJuego}">
                        </div>

                        <button class="btn btn-success">
                            Guardar cambios
                        </button>

                        <a class="btn btn-secondary" th:href="@{/}">
                            Cancelar
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
